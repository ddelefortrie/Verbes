/* ---- petit générateur PDF (A4, polices standard, sans bibliothèque) ---- */
const WIN = { 'œ': 156, 'Œ': 140, '’': 146, '‘': 145, '–': 150, '—': 151, '…': 133, '€': 128, '“': 147, '”': 148 };
function octetsPDF(t) {
  const out = [];
  for (const ch of String(t)) {
    let c = ch.charCodeAt(0);
    if (WIN[ch]) c = WIN[ch]; else if (c > 255) c = 63;
    if (c === 40 || c === 41 || c === 92) out.push(92);
    out.push(c);
  }
  return out;
}
function largeur(t, taille, gras) {   // estimation de la largeur Helvetica
  let w = 0;
  for (const ch of String(t)) {
    w += /[ijlI.,;:'!|ïî]/.test(ch) ? .26 : /[ftr ()\-]/.test(ch) ? .33 : /[mwMW]/.test(ch) ? .85 : /[A-Z]/.test(ch) ? .68 : .56;
  }
  return w * taille * (gras ? 1.06 : 1);
}
function creerPDF(lid, sans) {
  const L = groupesListe(lid), W = 595.28, H = 841.89, M = 42;
  const pages = []; let ops = [], y = 0;
  const T = function (x, yy, txt, taille, police, gris) {
    ops.push({ t: 'T', x: x, y: yy, txt: txt, s: taille, f: police || 'F1', g: gris || 0 });
  };
  const ajuste = function (txt, max, taille, gras) { let s = taille; while (s > 6 && largeur(txt, s, gras) > max) s -= .5; return s; };
  const ligne = function (x1, y1, x2, y2, gris, ep, poin) { ops.push({ t: 'L', x1: x1, y1: y1, x2: x2, y2: y2, g: gris, e: ep || .5, d: poin }); };
  const nouvelle = function (premiere) {
    if (ops.length) pages.push(ops);
    ops = []; y = H - M;
    if (premiere) {
      ops.push({ t: 'I', x: M, y: y - 42, w: 126, h: 42 });
      T(M + 140, y - 20, L.def[1], 17, 'F2');
      T(M + 140, y - 36, 'Français · l\'indicatif présent · ' + verbesDe(L.def[2]).length + ' verbes', 9.5, 'F1', .3);
      y -= 52; ligne(M, y, W - M, y, .55, 1.6);
      y -= 22; T(M, y, 'Nom : ________________________________      Classe : __________', 10, 'F1', .2);
      y -= 12;
    } else { T(M, y - 8, L.def[1] + ' (suite)', 9, 'F3', .4); y -= 20; }
  };
  nouvelle(true);
  L.groupes.forEach(function (g) {
    const cols = g.irr ? 1 : 2, cw = (W - 2 * M - (cols - 1) * 22) / cols, hl = 15.5;
    if (y - 34 - hl < M) nouvelle(false);
    y -= 22; T(M, y, g.titre, 11.5, 'F2'); y -= 5; ligne(M, y, W - M, y, .6, .75); y -= 2;
    const rangs = Math.ceil(g.verbes.length / cols);
    for (let r = 0; r < rangs; r++) {
      if (y - hl < M) { nouvelle(false); }
      y -= hl;
      for (let c = 0; c < cols; c++) {
        const v = g.verbes[c * rangs + r]; if (!v) continue;
        const x = M + c * (cw + 22);
        const wfr = g.irr ? 92 : cw * .38, wnl = g.irr ? 140 : cw - wfr - 6;
        T(x, y + 4, v.inf, ajuste(v.inf, wfr - 6, 10.5, true), 'F2');
        if (!sans) T(x + wfr, y + 4, v.nl, ajuste(v.nl, wnl - 6, 10, false), 'F1', .15);
        if (g.irr && !sans) { const f = formesTexte(v); T(x + wfr + wnl, y + 4, f, ajuste(f, cw - wfr - wnl, 9.5, false), 'F3', .1); }
        ligne(x, y, x + cw, y, .7, .5, true);
      }
    }
  });
  pages.push(ops);

  /* assemblage des objets PDF */
  const logo = document.querySelector('.logo-zone img'), src = logo ? logo.getAttribute('src') : '';
  let jpg = null;
  if (/^data:image\/jpeg;base64,/.test(src)) { const b = atob(src.split(',')[1]); jpg = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) jpg[i] = b.charCodeAt(i); }
  const morceaux = [], offs = [];
  let taille = 0;
  const push = function (x) { const u = typeof x === 'string' ? new Uint8Array(octetsPDF2(x)) : x; morceaux.push(u); taille += u.length; };
  function octetsPDF2(str) { const a = []; for (let i = 0; i < str.length; i++) a.push(str.charCodeAt(i) & 255); return a; }
  const n = 5 + pages.length * 2;          // 1 catalogue, 2 pages, 3-5 polices, puis page + contenu, puis image
  const imgId = n + 1;
  const obj = function (id, corps) { offs[id] = taille; push(id + ' 0 obj\n'); corps(); push('\nendobj\n'); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, function () { push('<< /Type /Catalog /Pages 2 0 R >>'); });
  obj(2, function () { push('<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map(function (_, i) { return (6 + i * 2) + ' 0 R'; }).join(' ') + '] >>'); });
  ['Helvetica', 'Helvetica-Bold', 'Helvetica-Oblique'].forEach(function (f, i) {
    obj(3 + i, function () { push('<< /Type /Font /Subtype /Type1 /BaseFont /' + f + ' /Encoding /WinAnsiEncoding >>'); });
  });
  pages.forEach(function (ops, i) {
    const pid = 6 + i * 2, cid = pid + 1;
    obj(pid, function () {
      push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Contents ' + cid + ' 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >>' + (jpg ? ' /XObject << /Im1 ' + imgId + ' 0 R >>' : '') + ' >> >>');
    });
    const c = [];
    const f2 = function (x) { return (Math.round(x * 100) / 100).toString(); };
    ops.forEach(function (o) {
      if (o.t === 'T') {
        c.push(octetsPDF2('BT /' + o.f + ' ' + f2(o.s) + ' Tf ' + f2(o.g) + ' g ' + f2(o.x) + ' ' + f2(o.y) + ' Td ('), octetsPDF(o.txt), octetsPDF2(') Tj ET\n'));
      } else if (o.t === 'L') {
        c.push(octetsPDF2(f2(o.g) + ' G ' + f2(o.e) + ' w ' + (o.d ? '[1 2] 0 d ' : '[] 0 d ') + f2(o.x1) + ' ' + f2(o.y1) + ' m ' + f2(o.x2) + ' ' + f2(o.y2) + ' l S\n'));
      } else if (o.t === 'I' && jpg) {
        c.push(octetsPDF2('q ' + o.w + ' 0 0 ' + o.h + ' ' + f2(o.x) + ' ' + f2(o.y) + ' cm /Im1 Do Q\n'));
      }
    });
    const flat = [].concat.apply([], c);
    obj(cid, function () { push('<< /Length ' + flat.length + ' >>\nstream\n'); push(new Uint8Array(flat)); push('\nendstream'); });
  });
  if (jpg) obj(imgId, function () { push('<< /Type /XObject /Subtype /Image /Width 600 /Height 200 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n'); push(jpg); push('\nendstream'); });
  const total = jpg ? imgId : n;
  const xref = taille;
  let x = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(morceaux, { type: 'application/pdf' });
}
function nomFichier(lid, sans) {
  const b = sansAcc(defListe(lid)[1].toLowerCase()).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return (/^verbes/.test(b) ? b : 'verbes-' + b) + (sans ? '-sans-traduction' : '') + '.pdf';
}
function telechargerPDF(lid, sans) {
  const msg = $('#pdf-msg'), blob = creerPDF(lid, sans), nom = nomFichier(lid, sans);
  if (CONFIG.ARTIFACT && window.claude && window.claude.use) {
    window.claude.use('downloads').then(function (d) {
      if (!d) { msg.textContent = 'Le téléchargement n\'est pas disponible ici.'; return; }
      return d.save({ filename: nom, data: blob }).then(function () { msg.textContent = 'PDF prêt.'; }, function (e) {
        msg.textContent = e && e.code === 'declined' ? '' : 'Le téléchargement n\'a pas fonctionné.';
      });
    });
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  /* lien de secours : certains navigateurs bloquent le téléchargement depuis la page de l'école */
  msg.innerHTML = 'Le PDF ne s\'est pas téléchargé ? <a href="' + url + '" target="_blank" rel="noopener">Ouvrir le PDF</a>';
}

/* ---------------- cartes mémoire (flashcards) ---------------- */
function lancerCartes(lid, sens, n, seulement) {
  const def = defListe(lid);
  const cartes = seulement ? melange(seulement) : (function () { const tous = melange(verbesDe(def[2]).filter(function (v, i, a) { return a.indexOf(v) === i; })); return n ? tous.slice(0, n) : tous; })();
  const F = { file: cartes.slice(), i: 0, total: cartes.length, sus: 0, revoir: [], vus: {}, debut: Date.now() };
  const langues = sens === 'fn' ? ['français', 'néerlandais'] : ['néerlandais', 'français'];
  const face = function (v, cote) { const fr = (sens === 'fn') === (cote === 0); return fr ? '<span class="flash-mot">' + v.inf + '</span>' : '<span class="flash-mot nlmot" lang="nl">' + esc(v.nl) + '</span>'; };

  function rendre() {
    const v = F.file[F.i], reprise = !!F.vus[v.inf];
    affiche('<p class="sur-titre">' + nb(def[1]) + ' · ' + langues[0] + ' → ' + langues[1] + '</p><h1>Cartes mémoire</h1>' +
      '<div class="ex-barre"><div class="progres" role="progressbar" aria-valuemin="0" aria-valuemax="' + F.file.length + '" aria-valuenow="' + F.i + '"><span style="width:' + Math.round(100 * F.i / F.file.length) + '%"></span></div>' +
      '<span class="ex-compte">' + (reprise ? 'Carte à revoir' : 'Carte ' + (Object.keys(F.vus).length + 1) + ' sur ' + F.total) + (F.revoir.length ? ' · ' + F.revoir.length + ' à revoir' : '') + '</span></div>' +
      '<button type="button" class="flash avec-conj" id="flash" aria-label="Retourner la carte"><span class="flash-int">' +
      '<span class="flash-face recto"><span class="flash-langue">' + langues[0] + '</span>' + face(v, 0) + '<span class="flash-aide">' + t2(['Clique pour retourner la carte', 'Klik om het kaartje om te draaien']) + '</span></span>' +
      '<span class="flash-face verso" aria-hidden="true"><span class="flash-langue">' + langues[1] + '</span>' + face(v, 1) + '<span class="flash-aide">' + face(v, 0).replace('flash-mot', 'flash-rappel') + '</span>' +
      '<span class="flash-langue">indicatif présent</span>' + conjCases(v) + '</span>' +
      '</span></button>' +
      '<div class="actions flash-actions" id="flash-actions"><button type="button" class="btn primaire" id="f-tourner">Retourner la carte</button></div>' +
      '<div class="actions">' + bouton('Arrêter', function () { vPresent('trad'); }, 'lien-btn') + '</div>', filPresent('Cartes mémoire'));
    const carte = $('#flash');
    const tourner = function () {
      if (carte.classList.contains('retournee')) return;
      carte.classList.add('retournee');
      carte.querySelector('.verso').removeAttribute('aria-hidden'); carte.querySelector('.recto').setAttribute('aria-hidden', 'true');
      $('#flash-actions').innerHTML = '<button type="button" class="btn" id="f-revoir">À revoir</button><button type="button" class="btn primaire" id="f-su">Je le savais</button>';
      $('#f-revoir').onclick = function () { noter(false); }; $('#f-su').onclick = function () { noter(true); };
      $('#f-su').focus();
    };
    carte.onclick = tourner; $('#f-tourner').onclick = tourner;
    main.onkeydown = function (ev) {
      if (!carte.classList.contains('retournee')) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); tourner(); } return; }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); noter(true); } else if (ev.key === 'ArrowLeft') { ev.preventDefault(); noter(false); }
    };
    $('#f-tourner').focus();
  }
  function noter(su) {
    const v = F.file[F.i], premiere = !F.vus[v.inf];
    F.vus[v.inf] = true;
    if (premiere) { if (su) F.sus++; else F.revoir.push(v); }
    if (!su) F.file.push(v);          // la carte revient à la fin du paquet
    F.i++;
    if (F.i >= F.file.length) terminer(); else rendre();
  }
  function terminer() {
    const res = { total: F.total, correct: F.sus, duree: Math.round((Date.now() - F.debut) / 1000), verbes: cartes.map(function (v) { return v.inf; }), erreurs: F.revoir.map(function (v) { return v.inf + ' = ' + v.nl; }) };
    enregistrer({ module: 'Traductions', moduleId: 'trad', etape: def[1] + ' · cartes ' + (sens === 'fn' ? 'FR → NL' : 'NL → FR'), type: 'flashcards' }, res);
    const pct = Math.round(100 * F.sus / F.total);
    affiche('<h1>Cartes terminées</h1><section class="resultat"><div class="score-grand ' + (pct >= 80 ? 'ok' : pct >= 60 ? 'moyen' : 'bas') + '"><span class="pct">' + F.sus + '<small> / ' + F.total + '</small></span><span class="sur">sues du premier coup</span></div>' +
      '<div class="resultat-txt"><p class="msg">' + (F.revoir.length ? 'Tu as revu ' + F.revoir.length + ' carte' + (F.revoir.length > 1 ? 's' : '') + ' jusqu\'à les connaître.' : 'Tu connaissais toutes les cartes !') + '</p></div></section>' +
      (F.revoir.length ? '<section class="bloc"><h2>Cartes à revoir</h2><table class="voc"><tbody>' + F.revoir.map(function (v) { return '<tr><th scope="row">' + v.inf + '</th><td lang="nl">' + esc(v.nl) + '</td></tr>'; }).join('') + '</tbody></table></section>' : '') +
      '<div class="actions">' + (F.revoir.length ? bouton('Revoir seulement ces cartes', function () { lancerCartes(lid, sens, 0, F.revoir); }, 'primaire') : '') +
      bouton('Nouvelles cartes', function () { lancerCartes(lid, sens, n); }, F.revoir.length ? '' : 'primaire') + bouton('Retour aux traductions', function () { vPresent('trad'); }) + '</div>', filPresent('Cartes mémoire'));
  }
  rendre();
}
function lancerTrad(lid, mode, n) {
  const def = defListe(lid);
  const reserve = verbesDe(def[2]);
  const qs = tirerVerbes(def[2], n).map(function (v) { return qTrad(v, mode, reserve); });

      Backend.lire(ETAT.prof.code).then(function (r) {
        if (!r || !r.ok) return;
        ETAT.prof.rows = r.rows || [];
        Object.keys(reg).forEach(function (pid) { const z = $('#live-' + pid); if (z && reg[pid].actif) z.innerHTML = hLive(pid, reg[pid].ronde); });
      });
    }, 15000);
  }
}
function hLive(pid, ronde) {
  const rows = ETAT.prof.rows.filter(function (r) { return r.ronde === ronde && r.moduleId === pid; }), el = {};
  rows.forEach(function (r) {
    const k = cleDe(r), e = el[k] = el[k] || { nom: r.nom, classe: r.annee + ' · ' + r.finalite, debuts: 0, debut: '', test: null, sorties: [] };
    if (r.type === 'klas-start') { e.debuts++; if (!e.debut || r.date < e.debut) e.debut = r.date; }
    if (r.type === 'sortie') e.sorties.push(r);
    if (r.type === 'test-classe') e.test = r;
  });
  const liste = Object.keys(el).map(function (k) { return el[k]; }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
  if (!liste.length) return '<p class="vide">Aucun élève n\'a encore commencé ce test.</p>';
  const remis = liste.filter(function (e) { return e.test; }).length;
  return '<p class="live-titre"><b>' + liste.length + '</b> élève(s) ont commencé · <b>' + remis + '</b> ont remis le test</p><div class="table-zone"><table class="donnees"><thead><tr><th>Élève</th><th>Classe</th><th>Début</th><th>État</th><th class="num">Score</th><th class="num">Sorties</th><th>Détail des sorties</th></tr></thead><tbody>' +
    liste.map(function (e) {
      const nb2 = e.test ? (+e.test.sorties || 0) : e.sorties.length;
      const detail = e.test && e.test.detail ? e.test.detail : e.sorties.map(function (r) { return r.detail; }).join(' | ');
      return '<tr' + (nb2 ? ' class="alerte"' : '') + '><td>' + esc(e.nom) + '</td><td>' + esc(e.classe) + '</td><td>' + dateFr(e.debut).split(' ').pop() + (e.debuts > 1 ? ' <span class="score-pill bas" title="L\'élève a rouvert le test">' + e.debuts + ' débuts</span>' : '') + '</td>' +
        '<td>' + (e.test ? (/temps écoulé/.test(e.test.detail || '') ? '<span class="score-pill moyen">temps écoulé</span>' : '<span class="score-pill ok">remis</span>') : '<span class="score-pill moyen">en cours</span>') + '</td>' +
        '<td class="num">' + (e.test ? e.test.score + ' %' : '–') + '</td><td class="num">' + (nb2 ? '<span class="score-pill bas">' + nb2 + '</span>' : '0') + '</td><td class="erreurs-cell">' + esc(detail) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

const COL_CSV = [['date', 'Date'], ['nom', 'Nom'], ['annee', 'Année'], ['finalite', 'Finalité'], ['module', 'Module'], ['etape', 'Étape'], ['type', 'Type'], ['tentative', 'Passage'], ['total', 'Questions'], ['correct', 'Correctes'], ['score', 'Score (%)'], ['duree', 'Durée (s)'], ['reussi', 'Réussi'], ['sorties', 'Sorties de page'], ['detail', 'Détail des sorties'], ['ronde', 'Série test en classe'], ['email', 'E-mail'], ['verbes', 'Verbes'], ['erreurs', 'Erreurs']];
function csv() {
  const c = function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  return [COL_CSV.map(function (x) { return c(x[1]); }).join(';')].concat(lignesFiltrees().map(function (r) { return COL_CSV.map(function (x) { return c(r[x[0]]); }).join(';'); })).join('\r\n');
}
function copierCSV() {
  const m = $('#csv-msg'), txt = csv();
  const ok = function () { m.textContent = 'Copié. Collez dans un tableur.'; }, ko = function () { m.textContent = 'La copie est bloquée par le navigateur.'; };
  try { navigator.clipboard.writeText(txt).then(ok, ko); } catch (e) { ko(); }
}
function telechargerCSV() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv()], { type: 'text/csv;charset=utf-8' }));
  a.download = 'resultats-francais.csv'; document.body.appendChild(a); a.click(); a.remove();
}

    majPied();
    vLogin();
  });
} else if (Connexion.actif()) vConnexion();
else vLogin();
