<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français à De Beuk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Roboto+Slab:wght@400;500;700&display=swap">
<style>
/* Mise en page : en-tête de l'école (bande verte, barre grise, logo sur étiquette blanche),
   une colonne de lecture sur fond papier, les étapes d'un parcours reliées par un fil. */
:root {
  --papier: #fdfcfa;
  --surface: #ffffff;
  --creux: #f4f3ee;
  --encre: #454543;
  --encre-forte: #2f2f2d;
  --muet: #6d6c66;
  --ligne: #e3e1d8;
  --ligne-forte: #c9c7bc;
  --gris: #595959;
  --sur-gris: #ffffff;
  --lime: #bbc640;
  --lime-fort: #a3ae2b;
  --lime-doux: #f2f5d9;
  --lime-encre: #5a6610;
  --sur-lime: #272b05;
  --ok: #2c7a34;
  --ok-doux: #e5f3e3;
  --ko: #b93a2b;
  --ko-doux: #fbe8e4;
  --moyen: #8a6100;
  --moyen-doux: #fdf1cf;
  --ombre: 0 1px 2px rgba(60, 60, 50, .08), 0 4px 14px rgba(60, 60, 50, .06);
  --f-texte: 'Roboto', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --f-verbe: 'Roboto Slab', 'Rockwell', Georgia, serif;
  --rayon: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #1e1f1b; --surface: #292a25; --creux: #23241f; --encre: #e4e3dc; --encre-forte: #f6f5ef; --muet: #a9a89e;
    --ligne: #3b3c35; --ligne-forte: #55564c; --gris: #33342f; --sur-gris: #f6f5ef;
    --lime: #b6c13c; --lime-fort: #c4cf4c; --lime-doux: #30351a; --lime-encre: #cfd96a; --sur-lime: #20240a;
    --ok: #86cf8a; --ok-doux: #1f3322; --ko: #f19483; --ko-doux: #3c2420; --moyen: #e6bb55; --moyen-doux: #3a301a;
    --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #1e1f1b; --surface: #292a25; --creux: #23241f; --encre: #e4e3dc; --encre-forte: #f6f5ef; --muet: #a9a89e;
  --ligne: #3b3c35; --ligne-forte: #55564c; --gris: #33342f; --sur-gris: #f6f5ef;
  --lime: #b6c13c; --lime-fort: #c4cf4c; --lime-doux: #30351a; --lime-encre: #cfd96a; --sur-lime: #20240a;
  --ok: #86cf8a; --ok-doux: #1f3322; --ko: #f19483; --ko-doux: #3c2420; --moyen: #e6bb55; --moyen-doux: #3a301a;
  --ombre: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papier); color: var(--encre); font: 400 17px/1.55 var(--f-texte); }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { color: var(--encre-forte); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
small { font-size: .8em; }
:focus-visible { outline: 3px solid var(--lime-fort); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.page { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- en-tête ---------- */
.entete { background: var(--gris); color: var(--sur-gris); border-top: 8px solid var(--lime); }
.entete-in { max-width: 980px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; min-height: 64px; }
.logo-zone { background: #fff; border-radius: 0 0 10px 10px; padding: 6px 12px 8px; align-self: flex-start; box-shadow: var(--ombre); margin-bottom: -10px; position: relative; z-index: 2; line-height: 0; }
.logo-zone img { height: 52px; width: auto; max-width: 100%; display: block; }
.entete-titre { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.matiere { font-size: 1.35rem; font-weight: 500; letter-spacing: .01em; }
.devise { font-size: .82rem; opacity: .85; font-style: italic; }
.entete-outils { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; padding-block: 8px; }
.qui { display: flex; flex-direction: column; align-items: flex-end; font-size: .85rem; line-height: 1.25; }
.qui-nom { font-weight: 700; }
.qui-classe { opacity: .9; }
.qui .lien { color: var(--sur-gris); font-size: .8rem; }
.btn-nl { background: transparent; border: 1.5px solid var(--sur-gris); color: var(--sur-gris); border-radius: 999px; padding: 4px 12px; font-size: .82rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-nl[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--sur-lime); }
.fil { background: var(--lime); color: var(--sur-lime); font-size: .88rem; padding: 7px max(16px, calc((100% - 980px) / 2 + 16px)); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.fil-lien { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
.fil [aria-current] { font-weight: 700; }

/* ---------- contenu ---------- */
.contenu { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 34px 48px; display: flex; flex-direction: column; gap: 20px; }
.contenu > h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -.01em; outline: none; }
.contenu > h1::first-letter { color: var(--lime-fort); }
.sur-titre { font-size: .85rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muet); font-weight: 500; margin-bottom: -14px; }
.chapo { font-weight: 700; font-style: italic; max-width: 62ch; margin-top: -8px; }
.discret { color: var(--muet); font-size: .88rem; }
.pied { border-top: 1px solid var(--ligne); color: var(--muet); font-size: .8rem; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; max-width: 980px; width: 100%; margin: 0 auto; }

/* aide en néerlandais */
.nl { display: none; color: var(--muet); font-style: italic; font-size: .9em; font-weight: 400; }
body.nl-on .nl { display: block; }
body.nl-on p.nl { margin-top: -6px; }

/* ---------- boutons ---------- */
.btn { border: 1.5px solid var(--ligne-forte); background: var(--surface); color: var(--encre-forte); border-radius: var(--rayon); padding: 10px 18px; font-weight: 500; cursor: pointer; line-height: 1.2; text-align: center; }
.btn:hover { border-color: var(--gris); }
.btn.primaire { background: var(--lime); border-color: var(--lime-fort); color: var(--sur-lime); font-weight: 700; }
.btn.primaire:hover { background: var(--lime-fort); }
.btn.grand { padding: 14px 26px; font-size: 1.05rem; }
.btn.petit { padding: 6px 12px; font-size: .88rem; }
.btn:disabled { opacity: .55; cursor: default; }
.lien, .lien-btn { background: none; border: 0; padding: 0; color: var(--lime-encre); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 500; }
.btn.lien-btn { border: 0; background: none; padding: 0; font-size: .9rem; text-align: left; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }

/* ---------- blocs ---------- */
.bloc { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.bloc.etroit { max-width: 460px; }
.bloc > h2, .parcours h2 { font-size: 1.3rem; }
.bloc.rappel { background: var(--lime-doux); border-color: transparent; }
.vide { color: var(--muet); }

/* ---------- connexion ---------- */
.login { display: flex; flex-direction: column; gap: 18px; }
.login h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 700; }
.login h1::first-letter { color: var(--lime-fort); }
.login .chapo { margin-top: 0; }
#f-login { display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; width: 100%; max-width: 560px; }
label { display: flex; flex-direction: column; gap: 5px; font-weight: 500; font-size: .92rem; }
input[type="text"], input[type="password"], input[type="search"], select { border: 1.5px solid var(--ligne-forte); background: var(--surface); border-radius: 6px; padding: 10px 12px; font-weight: 400; font-size: 1rem; min-width: 0; width: 100%; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; width: 100%; }
legend { font-weight: 700; padding: 0; margin-bottom: 10px; color: var(--encre-forte); }
.classes-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.classe-col { background: var(--surface); border: 1px solid var(--ligne); border-top: 5px solid var(--lime); border-radius: var(--rayon); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.classe-col h2 { font-size: 1.08rem; }
.classe-col h2 small { display: block; font-weight: 400; color: var(--muet); font-style: italic; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts.serre { gap: 6px; }
.classe-col .opts { display: grid; grid-template-columns: 1fr 1fr; }
.opt { display: block; position: relative; font-weight: 400; font-size: 1rem; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: block; border: 1.5px solid var(--ligne-forte); border-radius: 6px; padding: 8px 14px; background: var(--surface); text-align: center; }
.opt span small { color: var(--muet); margin-left: 4px; }
.opt input:checked + span { background: var(--lime); border-color: var(--lime-fort); color: var(--sur-lime); font-weight: 700; }
.opt input:checked + span small { color: var(--sur-lime); }
.opt input:focus-visible + span { outline: 3px solid var(--lime-fort); outline-offset: 2px; }
.erreur { color: var(--ko); font-weight: 500; }
.prof-lien { margin-top: 18px; font-size: .9rem; }

/* ---------- menus ---------- */
.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.carte-menu { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--ligne); border-top: 6px solid var(--lime); border-radius: var(--rayon); padding: 20px 56px 22px 20px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; box-shadow: var(--ombre); min-height: 120px; }
button.carte-menu:hover { border-color: var(--lime-fort); }
.cm-titre { font-size: 1.4rem; font-weight: 700; color: var(--encre-forte); }
.cm-texte { color: var(--muet); }
.cm-go { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; color: var(--lime-fort); }
.carte-menu.bientot { border-top-color: var(--ligne-forte); box-shadow: none; background: var(--creux); cursor: default; }
.carte-menu.bientot .cm-titre { color: var(--muet); font-size: 1.1rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- onglets ---------- */
.onglets-zone { overflow-x: auto; margin-inline: -16px; padding-inline: 16px; border-bottom: 2px solid var(--ligne); scrollbar-width: thin; }
.onglets { display: flex; gap: 4px; width: max-content; }
.onglet { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--muet); border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.onglet:hover { color: var(--encre-forte); }
.onglet[aria-selected="true"] { color: var(--encre-forte); font-weight: 700; border-bottom-color: var(--lime-fort); }
.onglet-corps { display: flex; flex-direction: column; gap: 22px; }

/* ---------- parcours ---------- */
.parcours { background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: clamp(16px, 4vw, 26px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.parcours-tete { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.meta { color: var(--muet); font-size: .92rem; margin-top: 4px; }
.badge { border-radius: 999px; padding: 4px 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok-doux); color: var(--ok); }
.etapes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.etape { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 6px 14px; align-items: center; padding-block: 12px; position: relative; }
.etape + .etape { border-top: 1px dashed var(--ligne); }
.etape::before { content: ''; position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; background: var(--ligne); z-index: 0; }
.etape:first-child::before { top: 50%; }
.etape:last-child::before { bottom: 50%; }
.pastille { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 2px solid var(--ligne-forte); color: var(--muet); position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
.etape.courant .pastille { border-color: var(--lime-fort); background: var(--lime); color: var(--sur-lime); }
.etape.fait .pastille { border-color: var(--ok); background: var(--ok-doux); color: var(--ok); }
.etape-txt h3 { font-size: 1.05rem; }
.etape-txt p { color: var(--muet); font-size: .88rem; }
.etape.verrou .etape-txt h3 { color: var(--muet); font-weight: 500; }
.verrou-txt { grid-column: 3 / 5; color: var(--muet); font-size: .82rem; font-style: italic; text-align: right; max-width: 24ch; }
.etape .btn { grid-column: 4; }
.etape .score-pill { grid-column: 3; }
.etape.test .etape-txt h3 { font-size: 1.12rem; }
.score-pill { border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-block; }
.score-pill.ok { background: var(--ok-doux); color: var(--ok); }
.score-pill.moyen { background: var(--moyen-doux); color: var(--moyen); }
.score-pill.bas { background: var(--ko-doux); color: var(--ko); }
.parcours-pied { border-top: 1px solid var(--ligne); padding-top: 14px; }
.parcours-pied > div { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.confirm-txt { font-size: .9rem; }

.libre-note { font-style: italic; }
.conseillee { color: var(--lime-encre); font-weight: 700; }
.etape.libre .etape-txt h3 { font-weight: 500; }

/* ---------- compte de l'école ---------- */
.compte { display: flex; gap: 10px; align-items: flex-start; background: var(--ok-doux); color: var(--encre-forte); border-radius: var(--rayon); padding: 10px 14px; max-width: 62ch; overflow-wrap: anywhere; }
.compte-point { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: var(--surface); display: grid; place-items: center; font-size: .85rem; font-weight: 700; }

/* ---------- environnement protégé ---------- */
body.protege #main { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.protege #main input { -webkit-user-select: text; user-select: text; }
.alerte-sortie { background: var(--ko-doux); color: var(--ko); border-radius: var(--rayon); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.alerte-sortie p { flex: 1 1 240px; }
.alerte-sortie .nl { color: inherit; opacity: .85; }
.sorties-note { color: var(--ko); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gris); color: var(--sur-gris); padding: 10px 18px; border-radius: 999px; box-shadow: var(--ombre); z-index: 20; max-width: calc(100vw - 32px); text-align: center; font-size: .92rem; }
@media print { body.protege .page { display: none; } }

/* ---------- cartes mémoire ---------- */
.h2-note { font-weight: 400; color: var(--muet); font-size: .8em; font-style: italic; margin-left: 6px; }
.flash { display: block; width: 100%; max-width: 560px; margin-inline: auto; min-height: 250px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 1200px; color: inherit; font: inherit; }
.flash-int { position: relative; display: block; width: 100%; min-height: 250px; transform-style: preserve-3d; transition: transform .45s; }
.flash.retournee .flash-int { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 22px; border-radius: 14px; border: 1px solid var(--ligne); border-top: 8px solid var(--lime); background: var(--surface); box-shadow: var(--ombre); backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; }
.flash-face.verso { transform: rotateY(180deg); border-top-color: var(--gris); background: var(--lime-doux); }
.flash-langue { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muet); }
.flash-mot { font-family: var(--f-verbe); font-size: clamp(1.5rem, 6vw, 2.3rem); font-weight: 700; color: var(--encre-forte); overflow-wrap: anywhere; line-height: 1.25; }
.flash-mot.nlmot { font-family: var(--f-texte); font-style: italic; font-weight: 500; font-size: clamp(1.25rem, 5vw, 1.8rem); }
.flash-aide { font-size: .85rem; color: var(--muet); }
.flash-rappel { font-family: var(--f-verbe); }
.flash-rappel.nlmot { font-family: var(--f-texte); font-style: italic; }
.flash.avec-conj, .flash.avec-conj .flash-int { min-height: 390px; }
.flash-conj { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(3, auto); gap: 4px 22px; font-family: var(--f-verbe); font-size: clamp(.98rem, 3.6vw, 1.15rem); text-align: left; color: var(--encre-forte); border-top: 1px solid var(--ligne-forte); padding-top: 12px; }
.flash-conj b { color: var(--lime-encre); }
.flash-conj i { font-style: normal; color: var(--muet); font-family: var(--f-texte); font-size: .9em; }
.voc-formes { font-family: var(--f-verbe); font-size: .9rem; padding-left: 16px; color: var(--encre); }
.flash-actions { justify-content: center; }
.flash-actions .btn { min-width: 150px; padding: 12px 20px; }
.imp-reglages { border-bottom: 1px solid var(--ligne); padding-bottom: 16px; gap: 12px; }

/* ---------- impression des listes : aperçu à l'écran et impression ---------- */
.impression { display: none; }
.feuille-zone { overflow-x: auto; padding-block: 4px 12px; }
.feuille { background: #fff; color: #111; width: 100%; max-width: 794px; margin-inline: auto; padding: clamp(18px, 5vw, 48px); box-shadow: 0 2px 16px rgba(0, 0, 0, .18); border-radius: 2px; font: 14px/1.35 var(--f-texte); }
.feuille h1, .feuille h2 { color: #111; }
.imp-tete { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #a3ae2b; padding-bottom: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.imp-tete img { height: 46px; width: auto; }
.imp-tete h1 { font-size: 1.45em; }
.imp-tete p { font-size: .85em; color: #444; }
.imp-nom { font-size: .9em; color: #333; margin: 6px 0 4px; }
.imp-groupe { margin-top: 12px; }
.imp-groupe h2 { font-size: 1.05em; border-bottom: 1px solid #999; padding-bottom: 2px; margin-bottom: 4px; break-after: avoid; }
.imp-colonnes { columns: 2 260px; column-gap: 26px; }
.imp-ligne { display: flex; gap: 8px; break-inside: avoid; padding: 2px 0; border-bottom: 1px dotted #bbb; min-height: 1.6em; }
.imp-fr { flex: 0 0 38%; font-family: var(--f-verbe); font-weight: 700; }
.imp-nl { flex: 1; color: #222; }
.imp-colonnes.une { columns: 1; }
.imp-colonnes.une .imp-fr { flex: 0 0 17%; }
.imp-colonnes.une .imp-nl { flex: 0 0 24%; }
.imp-formes { flex: 1; font-family: var(--f-verbe); font-size: .9em; }
@media print {
  body { background: #fff; }
  body.imprime .page, body.imprime .toast, body.imprime dialog { display: none !important; }
  body.imprime .impression { display: block; color: #000; font: 11pt/1.35 var(--f-texte); }
  @page { margin: 14mm; }
}

/* ---------- connexion Google, tests en classe ---------- */
.g-bouton { min-height: 44px; }
.classe-bloc { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--lime-doux); border-color: transparent; }
.classe-bloc p { color: var(--muet); }
.classe-carte.ouvert { border-color: var(--lime-fort); border-width: 2px; }
.classe-tete { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.classe-reglages { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: flex-end; }
.code-classe { max-width: 260px; }
.duree-classe { max-width: 170px; }
.minuteur { align-self: flex-start; display: flex; align-items: baseline; gap: 10px; background: var(--gris); color: var(--sur-gris); border-radius: 999px; padding: 6px 16px; }
.minuteur span { font-size: .85rem; }
.minuteur b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.minuteur.presque { background: var(--ko); color: #fff; }
.badge.ferme { background: var(--creux); color: var(--muet); }
.live { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--ligne); padding-top: 14px; }
.donnees tr.alerte td { background: var(--ko-doux); }
.sortie-detail { color: var(--ko); margin-bottom: 4px; }
.etape.classe .pastille { font-size: 1.05rem; }
.etape.classe.verrou .pastille { border-style: dashed; }

/* ---------- théorie ---------- */
.theorie { display: flex; flex-direction: column; gap: 14px; max-width: 72ch; }
.theorie b { color: var(--encre-forte); }
.theorie s { color: var(--muet); }
.theorie h3 { font-size: 1.05rem; margin-top: 6px; }
.pas, .court, .regles { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.pas li::marker { font-weight: 700; color: var(--lime-encre); }
.note { background: var(--lime-doux); border-radius: var(--rayon); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.rappel .note { background: var(--surface); }
.tables { display: flex; flex-wrap: wrap; gap: 14px; }
.conj { border-collapse: collapse; background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); overflow: hidden; font-family: var(--f-verbe); font-size: 1rem; flex: 0 1 auto; }
.conj caption { caption-side: top; text-align: left; font-weight: 700; padding: 0 0 4px 2px; color: var(--encre-forte); }
.conj caption small { font-family: var(--f-texte); font-weight: 400; color: var(--muet); display: block; }
.conj th { text-align: right; font-weight: 400; color: var(--muet); padding: 4px 8px 4px 12px; white-space: nowrap; font-family: var(--f-texte); font-size: .9rem; }
.conj td { padding: 4px 14px 4px 4px; white-space: nowrap; }
.conj td b { color: var(--lime-encre); font-weight: 700; }
.conj td i { font-style: normal; color: var(--ko); font-weight: 500; }
.conj td small { font-family: var(--f-texte); color: var(--muet); }
.conj tr.hot { background: var(--lime-doux); }
.conj tr + tr { border-top: 1px solid var(--ligne); }

.emplois { display: flex; flex-direction: column; gap: 4px; }
.tl-legende { width: 300px; max-width: 100%; margin-left: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muet); }
.tl-legende span:nth-child(2) { text-align: center; color: var(--encre-forte); font-weight: 700; }
.tl-legende span:nth-child(3) { text-align: right; }
.emploi { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 8px 20px; align-items: center; padding-block: 10px; border-top: 1px solid var(--ligne); }
.emploi h4 { font-size: 1rem; display: flex; gap: 8px; align-items: baseline; }
.emploi .num { color: var(--lime-encre); font-variant-numeric: tabular-nums; }
.emploi .ex { font-family: var(--f-verbe); margin-top: 2px; }
.emploi .ex b { color: var(--lime-encre); }
.tl { width: 300px; max-width: 100%; height: auto; display: block; }
.tl-axe { stroke: var(--ligne-forte); stroke-width: 2; fill: none; }
.tl-fleche { fill: var(--ligne-forte); }
.tl-now { stroke: var(--encre-forte); stroke-width: 2; stroke-dasharray: 3 3; fill: none; }
.tl-m { fill: var(--lime-fort); stroke: var(--surface); stroke-width: 2; }

/* ---------- exercice ---------- */
.ex-barre { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.progres { flex: 1 1 180px; height: 10px; background: var(--ligne); border-radius: 999px; overflow: hidden; }
.progres span { display: block; height: 100%; background: var(--lime-fort); border-radius: 999px; transition: width .25s; }
.ex-compte { font-size: .88rem; color: var(--muet); font-variant-numeric: tabular-nums; white-space: nowrap; }
.carte.question { background: var(--surface); border: 1px solid var(--ligne); border-top: 6px solid var(--lime); border-radius: var(--rayon); padding: clamp(18px, 5vw, 34px); display: flex; flex-direction: column; gap: 20px; box-shadow: var(--ombre); }
.consigne { font-weight: 500; }
.q-ligne { font-family: var(--f-verbe); font-size: clamp(1.15rem, 3.6vw, 1.45rem); line-height: 2; color: var(--encre-forte); min-width: 0; overflow-wrap: anywhere; }
.q-ligne .suj { font-weight: 700; }
.q-ligne .inf { color: var(--lime-encre); font-size: .85em; white-space: nowrap; }
.q-ligne .fleche { color: var(--muet); }
.nlmot { font-family: var(--f-texte); font-style: italic; }
.forme.grand { font-size: 1.4em; font-weight: 700; }
.forme.phrase { font-weight: 500; }
.trou { color: var(--lime-encre); font-weight: 700; letter-spacing: .1em; }
input.rep { font-family: var(--f-verbe); font-size: 1em; width: 9.5em; max-width: 100%; border: 0; border-bottom: 3px solid var(--lime-fort); border-radius: 6px 6px 0 0; background: var(--lime-doux); padding: 2px 10px; color: var(--encre-forte); }
.nb { white-space: nowrap; }
#prof-corps { display: flex; flex-direction: column; gap: 16px; }
input.rep { margin-inline: 3px; }
input.rep.large { width: 13em; }
input.rep.ok { border-bottom-color: var(--ok); background: var(--ok-doux); color: var(--ok); opacity: 1; -webkit-text-fill-color: var(--ok); }
input.rep.ko { border-bottom-color: var(--ko); background: var(--ko-doux); }
input.rep:disabled.ko { color: var(--ko); -webkit-text-fill-color: var(--ko); opacity: 1; text-decoration: line-through; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.acc { min-width: 40px; height: 40px; border: 1.5px solid var(--ligne-forte); background: var(--surface); border-radius: 6px; font-family: var(--f-verbe); font-size: 1.1rem; cursor: pointer; color: var(--encre-forte); }
.acc:hover { background: var(--lime-doux); border-color: var(--lime-fort); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.option { border: 1.5px solid var(--ligne-forte); background: var(--surface); border-radius: var(--rayon); padding: 12px 14px; cursor: pointer; font-size: 1.05rem; text-align: left; color: var(--encre-forte); }
.option small { display: block; color: var(--muet); font-size: .82rem; }
.option:hover:not(:disabled) { border-color: var(--lime-fort); background: var(--lime-doux); }
.option.ok { border-color: var(--ok); background: var(--ok-doux); color: var(--ok); font-weight: 700; }
.option.ko { border-color: var(--ko); background: var(--ko-doux); color: var(--ko); text-decoration: line-through; }
.option:disabled { cursor: default; opacity: 1; }
.retour:empty { display: none; }
.retour { border-radius: var(--rayon); padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.retour.ok { background: var(--ok-doux); color: var(--ok); }
.retour.ko { background: var(--ko-doux); color: var(--ko); }
.retour.indice { background: var(--moyen-doux); color: var(--moyen); }
.retour .bonne { font-family: var(--f-verbe); font-weight: 700; font-size: 1.1rem; color: var(--encre-forte); }
.retour .nl { color: inherit; opacity: .85; }
.reprise-note { font-size: .88rem; }

/* ---------- résultat ---------- */
.resultat { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; }
.score-grand { border-radius: 50%; width: 148px; height: 148px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 8px solid; flex: none; background: var(--surface); padding: 8px; }
.score-grand.ok { border-color: var(--ok); color: var(--ok); }
.score-grand.moyen { border-color: var(--moyen); color: var(--moyen); }
.score-grand.bas { border-color: var(--ko); color: var(--ko); }
.score-grand .pct { font-size: 2.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score-grand .pct small { font-size: 1rem; }
.score-grand .sur { font-size: .74rem; color: var(--muet); line-height: 1.2; margin-top: 4px; }
.resultat-txt { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.msg { font-size: 1.3rem; font-weight: 700; color: var(--encre-forte); }
.erreurs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.erreurs li { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--ligne); font-family: var(--f-verbe); }
.erreurs li:first-child { border-top: 0; }
.err-q { min-width: 0; overflow-wrap: anywhere; }
del { color: var(--ko); text-decoration-thickness: 2px; }
ins { color: var(--ok); text-decoration: none; font-weight: 700; }

/* ---------- test ---------- */
.test-form { display: flex; flex-direction: column; gap: 18px; }
.test-form h2 { font-size: 1.12rem; margin-top: 8px; }
.test-form h2 .nl { font-size: .85em; }
.test-liste { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--ligne); border-radius: var(--rayon); }
.test-liste li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 16px; }
.test-liste li + li { border-top: 1px solid var(--ligne); }
.test-liste .num { color: var(--muet); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; }
.test-liste .q-ligne { font-size: 1.12rem; }
.test-pied { position: sticky; bottom: 0; background: var(--papier); border-top: 2px solid var(--ligne); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; z-index: 3; }
.confirm { background: var(--moyen-doux); color: var(--moyen); border-radius: var(--rayon); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.confirm p { flex: 1 1 240px; }
.corr-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: center; }
.bascule { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }
.legende { font-size: .88rem; color: var(--muet); }
.test-liste.corrige li { grid-template-columns: 30px 22px minmax(0, 1fr); }
.test-liste.corrige li.faux { background: var(--ko-doux); }
.test-liste.corrige .marque { font-weight: 700; }
.test-liste.corrige li.juste .marque { color: var(--ok); }
.test-liste.corrige li.faux .marque { color: var(--ko); }
.test-liste.corrige.seul-err li.juste { display: none; }
.test-liste.corrige.seul-err li.faux { border-top: 1px solid var(--ligne); }

/* ---------- réglages (traductions, libre) ---------- */
.reglages { display: flex; flex-direction: column; gap: 18px; }
.reglages legend { font-size: .95rem; }
.reglages legend .lien { font-size: .82rem; margin-left: 10px; }
.liste-verbes { border-top: 1px solid var(--ligne); padding-block: 10px; }
.liste-verbes summary { cursor: pointer; font-weight: 700; color: var(--encre-forte); }
.liste-verbes summary small { color: var(--muet); font-weight: 400; margin-left: 6px; }
.voc { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 560px; }
.voc th { text-align: left; font-family: var(--f-verbe); font-weight: 500; padding: 4px 16px 4px 0; white-space: nowrap; vertical-align: top; color: var(--encre-forte); }
.voc td { padding: 4px 0; color: var(--muet); }
.voc tr + tr { border-top: 1px solid var(--ligne); }
.voc:has(.voc-formes) { max-width: none; }

/* ---------- suivi et espace professeur ---------- */
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tuile { background: var(--creux); border-radius: var(--rayon); padding: 12px 14px; display: flex; flex-direction: column; }
.tuile-val { font-size: 1.7rem; font-weight: 700; color: var(--encre-forte); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tuile-lab { font-size: .82rem; color: var(--muet); text-transform: uppercase; letter-spacing: .05em; }
.table-zone { overflow-x: auto; border: 1px solid var(--ligne); border-radius: var(--rayon); }
.donnees { border-collapse: collapse; width: 100%; font-size: .92rem; }
.donnees th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muet); padding: 8px 12px; background: var(--creux); white-space: nowrap; }
.donnees td { padding: 8px 12px; border-top: 1px solid var(--ligne); vertical-align: top; }
.donnees .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.erreurs-cell { font-size: .82rem; color: var(--muet); min-width: 220px; max-width: 420px; }
.filtres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.verbes-nuage { display: flex; flex-wrap: wrap; gap: 6px; }
.verbes-nuage span { background: var(--creux); border-radius: 999px; padding: 2px 10px; font-family: var(--f-verbe); font-size: .9rem; }
.verbes-nuage small { color: var(--muet); }
#f-prof { display: flex; flex-direction: column; gap: 14px; }

/* ---------- fenêtre de théorie ---------- */
.dlg { border: 0; border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: min(86vh, 900px); background: var(--surface); color: var(--encre); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.dlg::backdrop { background: rgba(40, 40, 36, .55); }
.dlg-tete { position: sticky; top: 0; background: var(--gris); color: var(--sur-gris); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-top: 6px solid var(--lime); z-index: 2; }
.dlg-tete h2 { color: var(--sur-gris); font-size: 1.15rem; }
.dlg-corps { padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.th-bloc { display: flex; flex-direction: column; gap: 12px; }
.th-bloc + .th-bloc { border-top: 1px solid var(--ligne); padding-top: 18px; }
.th-bloc > h3 { font-size: 1.1rem; }
.th-bloc details summary { cursor: pointer; color: var(--lime-encre); font-weight: 500; margin-bottom: 10px; }

@media (max-width: 620px) {
  body { font-size: 16px; }
  .logo-zone img { height: 42px; }
  .entete-titre .devise { display: none; }
  .emploi { grid-template-columns: minmax(0, 1fr); }
  .tl, .tl-legende { width: 100%; }
  .etape { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .etape .score-pill { grid-column: 3; grid-row: 1; }
  .etape .btn { grid-column: 2 / 4; grid-row: 2; justify-self: start; }
  .verrou-txt { grid-column: 2 / 4; grid-row: 2; text-align: left; max-width: none; }
  .classe-col .opts { grid-template-columns: 1fr 1fr; }
  .score-grand { width: 124px; height: 124px; }
  .acc { min-width: 36px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    case 'ayer': end = T_ER[p]; if (botte) { alts = [stem + end]; stem = stem.slice(0, -1) + 'i'; } break;
    case 'dbl': if (botte) stem = stem + stem.slice(-1); end = T_ER[p]; break;
    case 'egr': if (botte) { const i = stem.lastIndexOf('e'); stem = stem.slice(0, i) + 'è' + stem.slice(i + 1); } end = T_ER[p]; break;
    case 'ir2': end = T_IR2[p]; break;
    case 'irp': if (p < 3) stem = stem.slice(0, -1); end = T_IRP[p]; break;
    case 're': end = T_RE[p]; break;
    case 'irr': stem = ''; end = v.f[p]; if (v.alt && v.alt[p]) alts = v.alt[p].slice(); break;
  }
  return { stem: stem, end: end, main: stem + end, alts: alts };
}

/* Ajoute le pronom réfléchi si nécessaire : "me lave", "m'amuse" */
function avecRefl(v, p, forme) {
  if (!v.pron) return forme;
  const r = REFL[p];
  if (VOYELLE.test(forme) && r.length === 2) return r[0] + "'" + forme;
  return r + ' ' + forme;
}

/* Toutes les réponses acceptées (la première est la réponse de référence) */
function reponses(v, p) {
  const c = conj(v, p);
  return [c.main].concat(c.alts).map(function (f) { return avecRefl(v, p, f); });
}

/* Sujet affiché devant le champ de réponse */
function sujetPour(v, p, sujet) {
  if (p === 0 && sujet === 'je' && !v.pron && VOYELLE.test(conj(v, p).main)) return "j'";
  return sujet;
}

   (l'aide n'apparaît que si l'élève active « Aide NL »).
   ===================================================================== */

function bi(fr, nl) { return '<p>' + fr + '</p>' + (nl ? '<p class="nl" lang="nl">' + nl + '</p>' : ''); }
function li2(fr, nl) { return '<li>' + fr + (nl ? '<span class="nl" lang="nl">' + nl + '</span>' : '') + '</li>'; }

/* Tableau de conjugaison généré par le moteur. opts.hot = personnes à mettre en évidence */
function tableau(inf, opts) {
  opts = opts || {};
  const v = VERBES[inf];
  const hot = opts.hot || [];
  let h = '<table class="conj"><caption>' + inf + (opts.note ? ' <small>' + opts.note + '</small>' : '') + '</caption><tbody>';
  for (let p = 0; p < 6; p++) {
    const c = conj(v, p);
    let s = ['je', 'tu', 'il / elle / on', 'nous', 'vous', 'ils / elles'][p];
    if (p === 0 && !v.pron && VOYELLE.test(c.main)) s = "j'";
    let forme = v.t === 'irr' ? c.main : c.stem + '<b>' + c.end + '</b>';
    if (v.pron) {
      const r = REFL[p];
      forme = (VOYELLE.test(c.main) && r.length === 2 ? '<i>' + r[0] + "'</i>" : '<i>' + r + '</i> ') + forme;
    }
    if (c.alts.length) forme += ' <small>ou ' + c.alts.join(', ') + '</small>';
    h += '<tr' + (hot.indexOf(p) >= 0 ? ' class="hot"' : '') + '><th scope="row">' + s + '</th><td>' + forme + '</td></tr>';
  }
  return h + '</tbody></table>';
}
function tableaux() { return '<div class="tables">' + Array.prototype.slice.call(arguments).join('') + '</div>'; }
function liste(k, max) {
  const l = POOLS[k].map(function (v) { return v.inf; });
  return (max ? l.slice(0, max) : l).join(', ') + (max && l.length > max ? '…' : '');
}

const $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function melange(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function choix(a) { return a[Math.floor(Math.random() * a.length)]; }
function maj(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function norm(s) {
  return String(s || '').normalize('NFC').toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').replace(/'\s+/g, "'").replace(/[.!?,;]+$/, '').trim();
}
function sansAcc(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe'); }
/* empêche la coupure de « -er », « -ir »… en fin de ligne */
function nb(s) { return String(s).replace(/(^|[\s(,])(-[a-zé]+)/g, '$1<span class="nb">$2</span>'); }
function duree(s) { s = +s || 0; return s < 60 ? s + ' s' : Math.round(s / 60) + ' min'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function dateFr(iso, court) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleDateString('fr-BE', court ? { day: '2-digit', month: '2-digit' } : { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}

let PROG = null;
function progPropre(p) {
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
  p = (p && typeof p === 'object') ? p : {};
  if (!p.parcours || typeof p.parcours !== 'object') p.parcours = {};
  if (!p.used || typeof p.used !== 'object') p.used = {};
  if (!p.classe || typeof p.classe !== 'object') p.classe = {};
  return p;
}
/* Réunit la progression de deux appareils : une étape faite quelque part reste faite. */
function fusionProg(local, serveur) {
  const a = progPropre(local), b = progPropre(serveur);
  const out = { parcours: {}, used: Object.keys(b.used).length ? b.used : a.used, classe: Object.assign({}, a.classe, b.classe) };
  Object.keys(a.parcours).concat(Object.keys(b.parcours)).forEach(function (pid) {
    if (out.parcours[pid]) return;
    const x = a.parcours[pid], y = b.parcours[pid];
    if (!x || !y) { out.parcours[pid] = x || y; return; }
    const tx = x.tentative || 1, ty = y.tentative || 1;
    if (tx !== ty) { out.parcours[pid] = tx > ty ? x : y; return; }
    const m = { tentative: tx, etapes: {}, test: null }, ex = x.etapes || {}, ey = y.etapes || {};
    Object.keys(ex).concat(Object.keys(ey)).forEach(function (id) {
      const u = ex[id], v = ey[id];
      m.etapes[id] = !u ? v : !v ? u : { fait: true, dernier: v.dernier, meilleur: Math.max(u.meilleur || 0, v.meilleur || 0) };
    });
    if (x.test || y.test) {
      const u = x.test || {}, v = y.test || {};
      m.test = { meilleur: Math.max(u.meilleur || 0, v.meilleur || 0), reussi: !!(u.reussi || v.reussi), n: Math.max(u.n || 0, v.n || 0) };
    }
    out.parcours[pid] = m;
  });
  return out;
}

/* =====================================================================
   GÉNÉRATION DES QUESTIONS
   ===================================================================== */
function tirerVerbes(pools, n) {
  const files = {};
  pools.forEach(function (k) {
    if (files[k]) return;
    const deja = PROG && PROG.used[k] ? PROG.used[k] : [];
    const tous = melange(POOLS[k]);
    files[k] = tous.filter(function (v) { return deja.indexOf(v.inf) < 0; }).concat(tous.filter(function (v) { return deja.indexOf(v.inf) >= 0; }));
  });
  const out = [];
  for (let i = 0; out.length < n; i++) {
    const k = pools[i % pools.length];
    if (!files[k].length) files[k] = melange(POOLS[k]);
    const v = files[k].shift();
    out.push(v);
    if (PROG) {
      if (!PROG.used[k] || PROG.used[k].length >= POOLS[k].length) PROG.used[k] = [];
      if (PROG.used[k].indexOf(v.inf) < 0) PROG.used[k].push(v.inf);
    }
  }
  if (PROG && ETAT.eleve) sauverProg();
  return melange(out);
}
function personnes(n, bias) {
  let seq = [];
  while (seq.length < n) seq = seq.concat(melange([0, 1, 2, 3, 4, 5]));
  seq = seq.slice(0, n);
  if (bias != null) { for (let i = 0; i < n; i += 2) seq[i] = bias; seq = melange(seq); }
  return seq;
}

function qConj(v, p) {
  const suj = choix(SUJETS_CONJ[p]);
  const s = sujetPour(v, p, suj);
  const acc = reponses(v, p);
  const colle = s === "j'";
  return {
    type: 'in', v: v, p: p, sujet: suj, colle: colle,
    avant: '<span class="suj">' + s + '</span>', apres: '<span class="inf">(' + v.inf + ')</span>',
    accept: acc, bonne: s + (colle ? '' : ' ') + acc[0], etiq: s + (colle ? '' : ' ') + '… (' + v.inf + ')'
  };
}
function qPhrase(v, p, dejaComp) {
  let comps = v.c.filter(function (c) { return !dejaComp || !dejaComp[v.inf + c]; });
  if (!comps.length) comps = v.c;
  const comp = choix(comps);
  if (dejaComp) dejaComp[v.inf + comp] = true;
  let suj, texte = comp;
  const m = /^@(\d):([^|]+)\|(.*)$/.exec(comp);
  if (m) { p = +m[1]; suj = m[2]; texte = m[3]; } else { suj = choix(SUJETS_PHRASE[p]); }
  const s = maj(sujetPour(v, p, suj));
  const colle = /'$/.test(s);
  const fin = /[?!]$/.test(texte) ? '' : '.';
  const acc = reponses(v, p);
  return {
    type: 'in', v: v, p: p, sujet: suj, colle: colle, phrase: true,
    avant: '<span class="suj">' + s + '</span>', apres: '<span class="inf">(' + v.inf + ')</span> ' + texte + fin,
    accept: acc, bonne: s + (colle ? '' : ' ') + acc[0] + ' ' + texte + fin, etiq: s + (colle ? '' : ' ') + '… (' + v.inf + ') ' + texte + fin
  };
}
function qTerm(v, p) {
  const c = conj(v, p);
  const suj = choix(SUJETS_CONJ[p]);
  const s = sujetPour(v, p, suj);
  const terms = { er: T_ER, re: T_RE, ir2: T_IR2 }[v.t];
  const uniques = terms.filter(function (x, i) { return terms.indexOf(x) === i; });
  const lab = function (x) { return x ? '-' + x : '– (pas de terminaison)'; };
  return {
    type: 'mc', v: v, p: p,
    question: '<span class="suj">' + s + '</span>' + (s === "j'" ? '' : ' ') + '<span class="forme">' + c.stem + '<span class="trou">…</span></span> <span class="inf">(' + v.inf + ')</span>',
    options: melange(uniques).map(function (x) { return { label: lab(x), ok: x === c.end }; }),
    bonne: s + (s === "j'" ? '' : ' ') + c.main, etiq: s + ' ' + c.stem + '… (' + v.inf + ')'
  };
}
function qModele(v) {
  const mods = [['ir2', 'comme <b>finir</b>', 'je finis, nous finissons'], ['irp', 'comme <b>partir</b>', 'je pars, nous partons'], ['iro', 'comme <b>ouvrir</b>', "j'ouvre, nous ouvrons"]];
  const s0 = sujetPour(v, 0, 'je');
  return {
    type: 'mc', v: v,
    question: '<span class="forme grand">' + v.inf + '</span>',
    options: mods.map(function (m) { return { label: m[1] + '<small>' + m[2] + '</small>', ok: v.t === m[0], brut: m[1].replace(/<[^>]+>/g, '') }; }),
    bonne: v.inf + ' : ' + s0 + (s0 === "j'" ? '' : ' ') + conj(v, 0).main + ', nous ' + conj(v, 3).main, etiq: v.inf + ' (modèle)'

}
function sens(v) { return v.nl.split(',').map(function (x) { return x.trim(); }); }

  if (mode === 'tradfn') {
    return { type: 'mc', v: v, question: '<span class="forme grand">' + v.inf + '</span>', options: melange([v].concat(autres)).map(function (o) { return { label: esc(o.nl), ok: o === v, brut: o.nl }; }), bonne: v.inf + ' = ' + v.nl, etiq: v.inf };
  }

  }
  const ok = Object.keys(VERBES).map(function (k) { return VERBES[k]; }).filter(function (o) { return o === v || memeSens(o, v); }).map(function (o) { return o.inf; });
  return { type: 'in', v: v, trad: true, avant: '<span class="suj nlmot" lang="nl">' + esc(v.nl) + '</span> <span class="fleche">→</span>', apres: '', accept: [v.inf].concat(ok), bonne: v.nl + ' = ' + v.inf, etiq: v.nl, large: true };
}
function qEmploi(item) {
  return {
    type: 'mc', question: '<span class="forme phrase">' + item[0] + '</span>',
    options: EMPLOIS.map(function (e) { return { label: e.fr, ok: e.id === item[1], brut: e.fr }; }),
    bonne: item[0] + ' → ' + EMPLOIS.filter(function (e) { return e.id === item[1]; })[0].fr, etiq: item[0]
  };

function genererQuestions(ex) {
  const verbes = tirerVerbes(ex.pools, ex.n);
  const pers = personnes(ex.n, ex.bias);
  const vus = {}, comps = {};
  return verbes.map(function (v, i) {
    if (ex.mode === 'mcmodele') return qModele(v);
    let p = pers[i];
    if (ex.mode !== 'phr') { for (let k = 0; k < 6 && vus[v.inf + p]; k++) p = (p + 1) % 6; vus[v.inf + p] = true; }
    if (ex.mode === 'mcterm') return qTerm(v, p);
    if (ex.mode === 'phr') return qPhrase(v, p, comps);
    return qConj(v, p);
  });
}
function genererTest(par) {
  const t = par.test, n = t.conj + t.phr;
  const verbes = tirerVerbes(t.pools, n), pers = personnes(n), vus = {}, comps = {};
  return verbes.map(function (v, i) {
    let p = pers[i];
    if (i < t.conj) { for (let k = 0; k < 6 && vus[v.inf + p]; k++) p = (p + 1) % 6; vus[v.inf + p] = true; return qConj(v, p); }
    return qPhrase(v, p, comps);
  });
}

/* ---------------- correction ---------------- */
function verifier(q, saisie) {
  const n = norm(saisie);
  if (!n) return false;
  if (q.accept.indexOf(n) >= 0) return true;
  if (q.trad) return false;
  const sujets = [q.sujet, 'je', "j'", 'tu', 'il', 'elle', 'on', 'nous', 'vous', 'ils', 'elles'];
  for (let i = 0; i < sujets.length; i++) {
    const s = String(sujets[i] || '').toLowerCase(); if (!s) continue;
    const pre = /'$/.test(s) ? s : s + ' ';
    if (n.indexOf(pre) === 0 && q.accept.indexOf(n.slice(pre.length)) >= 0) return true;
  }
  return false;
}
function indice(q, saisie) {
  const n = norm(saisie);
  if (q.trad) return ["Ce n'est pas le bon verbe. Essaie encore.", 'Dat is niet het juiste werkwoord. Probeer opnieuw.'];
  if (q.accept.some(function (a) { return sansAcc(a) === sansAcc(n); })) return ['Presque ! Vérifie les accents et la cédille.', 'Bijna! Controleer de accenten en de cedille.'];
  if (n === q.v.inf || n === infNu(q.v)) return ["Tu as écrit l'infinitif. Conjugue le verbe.", 'Je schreef de infinitief. Vervoeg het werkwoord.'];
  if (q.v.pron && !/^(me |te |se |nous |vous |m'|t'|s')/.test(n)) return ["N'oublie pas le pronom réfléchi (me, te, se, nous, vous).", 'Vergeet het wederkerend voornaamwoord niet.'];
  if (q.v.t === 'irr') return ['Ce verbe est irrégulier. Pense au tableau de la théorie.', 'Dit werkwoord is onregelmatig. Denk aan de tabel uit de theorie.'];
  return ['Pas encore. Regarde bien le radical et la terminaison pour « ' + PERSONNES[q.p] + ' ».', 'Nog niet juist. Kijk goed naar de stam en de uitgang.'];
}

/* ---------------- environnement protégé (exercices et tests) ----------------
   Un site web ne peut pas empêcher une capture d'écran. Il peut par contre :
   - empêcher de sélectionner, copier, coller, imprimer et d'ouvrir le menu contextuel ;
   - compter chaque fois que l'élève quitte la page (autre onglet, autre fenêtre, outil de capture) ;
   - demander le plein écran pendant un test. */
const LIB_SORTIE = { onglet: 'autre onglet ou application', fenetre: 'autre fenêtre', plein: 'plein écran quitté', capture: 'touche capture d\'écran' };
const Garde = {
  actif: false, test: false, n: 0, dernier: 0, plein: false, details: [], ouvert: null, surSortie: null,
  demarrer: function (test, surSortie) { Garde.actif = true; Garde.test = !!test; Garde.n = 0; Garde.dernier = 0; Garde.details = []; Garde.ouvert = null; Garde.surSortie = surSortie || null; },
  arreter: function () {
    const res = { n: Garde.actif ? Garde.n : 0, detail: Garde.actif ? Garde.texte(Garde.details) : '' };
    Garde.actif = false; Garde.test = false; Garde.n = 0; Garde.details = []; Garde.ouvert = null; Garde.surSortie = null;
    return res;
  },
  sortie: function (type) {
    if (!Garde.actif) return;
    const t = Date.now();
    if (t - Garde.dernier < 1500) { if (type === 'onglet' && Garde.ouvert) Garde.ouvert.type = 'onglet'; return; }   // une seule sortie comptée
    Garde.dernier = t; Garde.n++;
    Garde.ouvert = { debut: t, type: type };
    Garde.details.push(Garde.ouvert);
    if (Garde.test) avertirSortie();
    if (type === 'plein' || type === 'capture') Garde.retour();
  },
  retour: function () {
    const ev = Garde.ouvert; if (!Garde.actif || !ev) return;
    ev.duree = Math.round((Date.now() - ev.debut) / 1000);
    Garde.ouvert = null;
    if (Garde.surSortie) Garde.surSortie(ev);
  },
  texte: function (liste) {
    return liste.map(function (e) {
      return new Date(e.debut).toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' · ' + LIB_SORTIE[e.type] +
        (e.type === 'plein' || e.type === 'capture' ? '' : ' · ' + (e.duree == null ? 'pas revenu' : e.duree + ' s'));
    }).join(' | ');
  }
};
function avertirSortie() {
  const el = $('#t-alerte'); if (!el) return;
  el.hidden = false;
  el.innerHTML = '<p><strong>Tu as quitté la page du test' + (Garde.n > 1 ? ' ' + Garde.n + ' fois' : '') + '.</strong> ' +
    t2(['C\'est signalé à ton professeur. Reste sur cette page jusqu\'à la fin.', 'Dit wordt gemeld aan je leerkracht. Blijf op deze pagina tot het einde.']) + '</p>' +
    (CONFIG.PLEIN_ECRAN && document.fullscreenEnabled && !document.fullscreenElement ? '<button type="button" class="btn petit" id="t-plein">Revenir en plein écran</button>' : '');
  const b = $('#t-plein'); if (b) b.onclick = function () { pleinEcran(true); b.remove(); };

/* ---------------- un parcours et ses étapes ---------------- */
function etatEtapes(par) {
  const pr = progDe(par.id);
  let prochaine = true;
  const et = par.etapes.map(function (e) {
    const d = pr.etapes[e.id], fait = !!(d && d.fait);
    const st = fait ? 'fait' : (prochaine ? 'courant' : 'libre');   // « courant » = prochaine étape conseillée
    if (!fait) prochaine = false;
    return { e: e, d: d, st: st };
  });
  return { etapes: et, toutFait: prochaine, pr: pr };
}
function descEtape(e) {
  const m = { mcterm: 'questions à choix', mcmodele: 'questions à choix', conj: 'conjugaisons', phr: 'phrases' }[e.ex.mode];
  return (e.lecon ? 'Leçon + ' : '') + e.ex.n + ' ' + m;
}
function hParcours(par) {
  const s = etatEtapes(par), pr = s.pr;
  const reussi = pr.test && pr.test.reussi;
  let h = '<article class="parcours"><header class="parcours-tete"><div><h2>' + nb(par.titre) + '</h2><p class="meta">' + nb(par.sous) + ' · environ ' + par.min + ' minutes' +
    (pr.tentative > 1 ? ' · ' + pr.tentative + '<sup>e</sup> passage' : '') + '</p>' +
    '<p class="meta libre-note">' + t2(['Fais les étapes dans l\'ordre que tu veux. Le test final s\'ouvre quand elles sont toutes faites.', 'Maak de stappen in de volgorde die je zelf kiest. De eindtoets gaat open zodra ze allemaal gemaakt zijn.']) + '</p></div>' +
    (reussi ? '<span class="badge ok">Parcours réussi</span>' : '') + '</header><ol class="etapes">';
  s.etapes.forEach(function (x, i) {
    const lance = function () { vEtape(par.id, i); };
    h += '<li class="etape ' + x.st + '"><span class="pastille"' + (x.st === 'fait' ? ' role="img" aria-label="Étape faite">✓' : ' aria-hidden="true">' + (i + 1)) + '</span>' +
      '<div class="etape-txt"><h3>' + nb(x.e.titre) + '</h3><p>' + descEtape(x.e) + (x.st === 'courant' ? ' · <span class="conseillee">étape conseillée</span>' : '') + '</p></div>' +
      (x.d && x.d.fait ? '<span class="score-pill ' + (x.d.dernier >= 80 ? 'ok' : (x.d.dernier >= 50 ? 'moyen' : 'bas')) + '">' + x.d.dernier + ' %</span>' : '') +
      bouton(x.st === 'fait' ? 'Refaire' : 'Commencer', lance, x.st === 'courant' ? 'primaire petit' : 'petit') + '</li>';
  });
  const nFait = s.etapes.filter(function (x) { return x.st === 'fait'; }).length;
  h += '<li class="etape test ' + (!s.toutFait ? 'verrou' : (reussi ? 'fait' : 'courant')) + '"><span class="pastille"' + (reussi && s.toutFait ? ' role="img" aria-label="Test réussi">✓' : ' aria-hidden="true">★') + '</span>' +
    '<div class="etape-txt"><h3>Test final</h3><p>' + (par.test.conj + par.test.phr) + ' questions · ' + CONFIG.SEUIL + ' % pour réussir</p></div>' +
    (pr.test ? '<span class="score-pill ' + (pr.test.meilleur >= CONFIG.SEUIL ? 'ok' : 'bas') + '">meilleur : ' + pr.test.meilleur + ' %</span>' : '') +
    (s.toutFait ? bouton(pr.test ? 'Refaire le test' : 'Passer le test', function () { vTestIntro(par.id); }, reussi ? 'petit' : 'primaire petit')
      : '<span class="verrou-txt">' + t2(['Fais d\'abord toutes les étapes (' + nFait + ' sur ' + s.etapes.length + ' faites)', 'Maak eerst alle stappen']) + '</span>') + '</li></ol>';
  h = h.replace(/<\/ol>$/, '') + hLigneClasse(par) + '</ol>';
  const commence = Object.keys(pr.etapes).length > 0;
  if (commence) {
    h += '<footer class="parcours-pied"><div id="re-' + par.id + '">' + bouton('Recommencer le parcours avec de nouveaux exercices', function () {
      $('#re-' + par.id).innerHTML = '<span class="confirm-txt">Tes étapes seront remises à zéro. Tes résultats restent enregistrés.</span> ' +
        bouton('Oui, recommencer', function () { pr.tentative += 1; pr.etapes = {}; pr.test = null; sauverProg(); vPresent(); }, 'primaire petit') + bouton('Annuler', function () { vPresent(); }, 'petit');
    }, 'lien-btn') + '</div></footer>';
  }
  return h + '</article>';
}

function hLigneClasse(par) {

function vEtape(pid, idx) {
  const par = PARCOURS[pid], e = par.etapes[idx];
  const fil = filPresent(par.titre);
  let h = '<p class="sur-titre">' + nb(par.titre) + ' · étape ' + (idx + 1) + ' sur ' + par.etapes.length + '</p><h1>' + nb(e.titre) + '</h1>';
  if (e.lecon) {
    h += '<section class="bloc"><div class="theorie">' + e.th.map(function (id) { return THEORIE[id].lecon(); }).join('') + '</div></section>';
  } else {
    h += '<section class="bloc rappel"><h2>Rappel</h2><div class="theorie">' + e.th.map(function (id) { return (e.th.length > 1 ? '<h3>' + THEORIE[id].titre + '</h3>' : '') + THEORIE[id].resume(); }).join('') + '</div></section>';
  }
  h += '<div class="actions">' + bouton('Commencer les exercices (' + e.ex.n + ' questions)', function () { lancerEtape(pid, idx); }, 'primaire grand') + bouton('Retour au parcours', function () { vPresent(par.onglet); }) + '</div>';
  affiche(h, fil);

function lancerEtape(pid, idx) {
  const par = PARCOURS[pid], e = par.etapes[idx], pr = progDe(pid);
  lancerExercice({
    titre: e.titre, surTitre: par.titre + ' · étape ' + (idx + 1) + ' sur ' + par.etapes.length, consigne: CONSIGNE[e.ex.mode],
    questions: genererQuestions(e.ex), th: e.th, fil: filPresent(par.titre),
    fin: function (res) {
      const score = Math.round(100 * res.correct / res.total);
      const d = pr.etapes[e.id] || { meilleur: 0 };
      pr.etapes[e.id] = { fait: true, dernier: score, meilleur: Math.max(d.meilleur || 0, score) };
      sauverProg();
      enregistrer({ module: par.titre, moduleId: pid, etape: (idx + 1) + '. ' + e.titre, type: 'exercice', tentative: pr.tentative }, res);
      /* suite : le test si tout est fait, sinon la prochaine étape pas encore faite */
      const etat = etatEtapes(par);
      let proch = -1;
      for (let k = 1; k <= par.etapes.length && proch < 0; k++) { const j = (idx + k) % par.etapes.length; if (etat.etapes[j].st !== 'fait') proch = j; }
      const suite = etat.toutFait ? bouton('Passer le test final', function () { vTestIntro(pid); }, 'primaire') : bouton('Étape suivante : ' + nb(par.etapes[proch].titre), function () { vEtape(pid, proch); }, 'primaire');
      ecranResultat({
        titre: 'Étape terminée', res: res,
        conseil: score < 60 ? ['Refais cette étape avant de continuer : relis d\'abord la théorie.', 'Maak deze stap opnieuw voor je verdergaat: lees eerst de theorie opnieuw.'] : null,
        actions: (score < 60 ? bouton('Refaire cette étape', function () { vEtape(pid, idx); }, 'primaire') + suite.replace('primaire', '') : suite + bouton('Refaire cette étape', function () { vEtape(pid, idx); })) +
          bouton('Retour au parcours', function () { vPresent(par.onglet); })
      });
    }
  });
}

/* =====================================================================
   EXERCICE : une question à la fois, aide et reprise des erreurs
   ===================================================================== */
function lancerExercice(cfg) {
  const R = { file: cfg.questions.slice(), i: 0, n: cfg.questions.length, ok: 0, essais: 0, erreurs: [], verbes: [], debut: Date.now(), phase: 'question' };
  cfg.questions.forEach(function (q) { if (q.v && R.verbes.indexOf(q.v.inf) < 0) R.verbes.push(q.v.inf); });
  Garde.demarrer(false);

  function rendre() {
    const q = R.file[R.i];
    const fait = Math.min(R.i, R.n), reprise = !!q.reprise;
    let h = (cfg.surTitre ? '<p class="sur-titre">' + nb(cfg.surTitre) + '</p>' : '') + '<h1>' + nb(cfg.titre) + '</h1>' +
      '<div class="ex-barre"><div class="progres" role="progressbar" aria-valuemin="0" aria-valuemax="' + R.file.length + '" aria-valuenow="' + R.i + '"><span style="width:' + Math.round(100 * R.i / R.file.length) + '%"></span></div>' +
      '<span class="ex-compte">' + (reprise ? 'Reprise d\'une erreur' : 'Question ' + (fait + 1) + ' sur ' + R.n) + '</span>' +
      (cfg.th ? bouton('Revoir la théorie', function () { ouvrirTheorie(cfg.th); }, 'petit theorie-btn') : '') + '</div>' +
      '<form class="carte question" id="f-q" novalidate autocomplete="off"><p class="consigne">' + t2(cfg.consigne) + '</p>';
    if (q.type === 'in') {
      h += '<div class="q-ligne' + (q.large ? ' large' : '') + '">' + q.avant + (q.colle ? '' : ' ') + '<input class="rep' + (q.large ? ' large' : '') + '" id="rep" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse"> ' + q.apres + '</div>' +
        barreAccents();
    } else {
      h += '<div class="q-ligne mc">' + q.question + '</div><div class="options">' + q.options.map(function (o, k) { return '<button type="button" class="option" data-k="' + k + '">' + o.label + '</button>'; }).join('') + '</div>';
    }
    h += '<div class="retour" id="retour" aria-live="polite"></div><div class="actions" id="q-actions">' + (q.type === 'in' ? '<button type="submit" class="btn primaire">Vérifier</button>' : '') + '</div></form>';
    affiche(h, cfg.fil, true);
    R.phase = 'question'; R.essais = 0;
    const f = $('#f-q');
    f.addEventListener('submit', function (ev) { ev.preventDefault(); if (R.phase === 'question') valider(); else suivant(); });
    if (q.type === 'in') { $('#rep').focus(); }
    else f.querySelectorAll('.option').forEach(function (b) { b.addEventListener('click', function () { if (R.phase === 'question') choisir(+b.getAttribute('data-k')); }); });
  }
  function terminer(q, juste, saisie) {
    R.phase = 'retour';
    if (!q.reprise) {
      if (juste && R.essais === 0) R.ok++;
      else if (!juste || R.essais > 0) {
        if (R.erreurs.length < 60 && q._err) R.erreurs.push(q._err);
      }
    }
    if (!juste && !q.reprise) {
      const copie = Object.assign({}, q, { reprise: true }); delete copie._err;
      R.file.splice(Math.min(R.i + 3, R.file.length), 0, copie);
    }
    const r = $('#retour');
    r.className = 'retour ' + (juste ? 'ok' : 'ko');
    r.innerHTML = juste
      ? '<p><strong>' + (R.essais === 0 ? 'Correct !' : 'Oui, c\'est ça.') + '</strong></p><p class="bonne">' + q.bonne + '</p>'
      : '<p><strong>Ce n\'est pas correct.</strong>' + (saisie ? ' Ta réponse : <del>' + esc(saisie) + '</del>' : '') + '</p>' +
        '<p>La bonne réponse : <span class="bonne">' + q.bonne + '</span></p>' +
        '<p class="reprise-note">' + t2(['Cette question revient un peu plus tard.', 'Deze vraag komt straks terug.']) + '</p>';
    $('#q-actions').innerHTML = '<button type="submit" class="btn primaire" id="btn-suiv">' + (R.i + 1 >= R.file.length ? 'Voir mon résultat' : 'Suivant') + '</button>';
    $('#btn-suiv').focus();
  }
  function valider() {
    const q = R.file[R.i], inp = $('#rep'), saisie = inp.value;
    if (!norm(saisie)) { inp.focus(); return; }
    const juste = verifier(q, saisie);
    if (!juste && !q._err) q._err = q.etiq + ' : ' + norm(saisie) + ' → ' + q.accept[0];
    if (juste) { inp.disabled = true; inp.classList.add('ok'); terminer(q, true, saisie); return; }
    if (R.essais === 0) {
      R.essais = 1;
      const r = $('#retour'); r.className = 'retour indice';
      r.innerHTML = '<p><strong>Essaie encore.</strong></p><p>' + t2(indice(q, saisie)) + '</p>';
      inp.classList.add('ko'); inp.focus(); inp.select();
      inp.addEventListener('input', function () { inp.classList.remove('ko'); }, { once: true });
      return;
    }
    inp.disabled = true; inp.classList.add('ko');
    terminer(q, false, saisie);
  }
  function choisir(k) {
    const q = R.file[R.i], o = q.options[k];
    main.querySelectorAll('.option').forEach(function (b, j) { b.disabled = true; if (q.options[j].ok) b.classList.add('ok'); else if (j === k) b.classList.add('ko'); });
    if (!o.ok) q._err = q.etiq + ' : ' + (o.brut || o.label).replace(/<[^>]+>/g, ' ') + ' → ' + q.bonne;
    terminer(q, o.ok, '');
  }
  function suivant() {
    R.i++;
    if (R.i >= R.file.length) {
      const g = Garde.arreter();
      cfg.fin({ total: R.n, correct: R.ok, duree: Math.round((Date.now() - R.debut) / 1000), verbes: R.verbes, erreurs: R.erreurs, sorties: g.n, detail: g.detail });
    } else rendre();
  }
  rendre();
}

function ecranResultat(o) {
  const res = o.res, pct = res.total ? Math.round(100 * res.correct / res.total) : 0;
  const msg = pct === 100 ? 'Parfait, aucune erreur !' : pct >= 80 ? 'Très bien !' : pct >= 60 ? 'Pas mal. Encore un petit effort.' : 'Ce n\'est pas encore acquis. Relis la théorie et réessaie.';
  let h = '<h1>' + o.titre + '</h1><section class="resultat"><div class="score-grand ' + (pct >= 80 ? 'ok' : pct >= 60 ? 'moyen' : 'bas') + '"><span class="pct">' + pct + '<small> %</small></span><span class="sur">' + res.correct + ' sur ' + res.total + ' du premier coup</span></div>' +

/* appelé depuis un clic : le plein écran n'est accordé que sur une action de l'élève */
function demarrerTest(pid) {
  if (!etatEtapes(PARCOURS[pid]).toutFait) { vPresent(PARCOURS[pid].onglet); return; }
  pleinEcran(true); vTest(pid);
}
function vTest(pid, classe) {
  const par = PARCOURS[pid], qs = genererTest(par), debut = Date.now();
  const titre = classe ? 'Test en classe' : 'Test final';
  /* pendant un test en classe, chaque retour sur la page envoie tout de suite la sortie au professeur */
  Garde.demarrer(true, classe ? function (ev) {
    enregistrer({ module: par.titre, moduleId: pid, etape: 'Test en classe', type: 'sortie', ronde: classe.ronde }, { total: 0, correct: 0, duree: ev.duree || 0, verbes: [], erreurs: [], sorties: 1, detail: Garde.texte([ev]) });
  } : null);
  const ligne = function (q, i) {
    return '<li><span class="num">' + (i + 1) + '</span><div class="q-ligne">' + q.avant + (q.colle ? '' : ' ') + '<input class="rep" data-i="' + i + '" id="t' + i + '" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Réponse ' + (i + 1) + '"> ' + q.apres + '</div></li>';
  };
  affiche('<p class="sur-titre">' + nb(par.titre) + '</p><h1>' + titre + '</h1>' +
    '<form id="f-test" class="test-form" novalidate autocomplete="off">' +
    '<h2>A. ' + t2(CONSIGNE.conj) + '</h2><ol class="test-liste">' + qs.slice(0, par.test.conj).map(ligne).join('') + '</ol>' +
    '<h2>B. ' + t2(CONSIGNE.phr) + '</h2><ol class="test-liste">' + qs.slice(par.test.conj).map(function (q, i) { return ligne(q, i + par.test.conj); }).join('') + '</ol>' +
    '<div class="test-pied">' + (classe ? '<div class="minuteur" id="t-temps" role="timer" aria-live="off"></div>' : '') + '<div class="alerte-sortie" id="t-alerte" role="alert" hidden></div>' + barreAccents() + '<div class="confirm" id="t-confirm" hidden></div><div class="actions"><button type="submit" class="btn primaire grand">Remettre le test</button></div></div></form>', classe ? [] : filPresent(par.titre), true);
  const f = $('#f-test');
  const champs = Array.prototype.slice.call(f.querySelectorAll('input.rep'));
  champs.forEach(function (c, i) {
    c.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); if (champs[i + 1]) champs[i + 1].focus(); } });
  });
  champs[0].focus();
  let confirme = false, fini = false;
  const remettre = function (auto) {
    if (fini) return; fini = true;
    const saisies = champs.map(function (c) { return c.value; }), g = Garde.arreter();
    if (auto) g.detail = 'Remis automatiquement : temps écoulé' + (g.detail ? ' | ' + g.detail : '');
    corrigerTest(pid, qs, saisies, Math.round((Date.now() - debut) / 1000), g, classe ? Object.assign({ auto: !!auto }, classe) : null);
  };
  if (classe && classe.restant != null) {
    const fin = Date.now() + classe.restant * 1000, el = $('#t-temps');
    const tic = function () {
      const r = Math.max(0, Math.round((fin - Date.now()) / 1000));
      el.innerHTML = '<span>Temps restant</span><b>' + Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') + '</b>';
      el.classList.toggle('presque', r <= 60);
      if (r <= 0) { clearInterval(ETAT.minuterie); ETAT.minuterie = null; remettre(true); }
    };
    tic(); if (!fini) ETAT.minuterie = setInterval(tic, 1000);
  }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (fini) return;
    const vides = champs.filter(function (c) { return !norm(c.value); }).length;
    if (vides && !confirme) {
      const c = $('#t-confirm'); c.hidden = false;
      c.innerHTML = '<p>Il reste <b>' + vides + '</b> réponse' + (vides > 1 ? 's' : '') + ' vide' + (vides > 1 ? 's' : '') + '. Veux-tu vraiment remettre le test ?</p>' +
        '<button type="submit" class="btn primaire petit">Oui, remettre</button> <button type="button" class="btn petit" id="t-non">Non, continuer</button>';
      confirme = true;
      $('#t-non').onclick = function () { c.hidden = true; confirme = false; const v = champs.filter(function (x) { return !norm(x.value); })[0]; if (v) v.focus(); };
      return;
    }
    remettre(false);
  });
}
function corrigerTest(pid, qs, saisies, duree, g, classe) {
  const sorties = g ? g.n : 0;
  const par = PARCOURS[pid], pr = progDe(pid);
  const justes = qs.map(function (q, i) { return verifier(q, saisies[i]); });
  const correct = justes.filter(Boolean).length, pct = Math.round(100 * correct / qs.length), reussi = pct >= CONFIG.SEUIL;
  const verbes = []; qs.forEach(function (q) { if (verbes.indexOf(q.v.inf) < 0) verbes.push(q.v.inf); });
  const erreurs = [], faibles = {};
  qs.forEach(function (q, i) { if (!justes[i]) { erreurs.push(q.etiq + ' : ' + (norm(saisies[i]) || '(vide)') + ' → ' + q.accept[0]); faibles[q.v.liste] = (faibles[q.v.liste] || 0) + 1; } });
  const res = { total: qs.length, correct: correct, duree: duree, verbes: verbes, erreurs: erreurs, reussi: reussi, sorties: sorties, detail: g ? g.detail : '' };
  if (classe) {
    PROG.classe[pid] = { ronde: classe.ronde, score: pct };
    sauverProg(); Backend.pousserProg();
    enregistrer({ module: par.titre, moduleId: pid, etape: 'Test en classe', type: 'test-classe', ronde: classe.ronde }, res);
    if (!classe.correction) {
      affiche('<p class="sur-titre">' + nb(par.titre) + '</p><h1>Test remis</h1><section class="resultat"><div class="score-grand ' + (reussi ? 'ok' : pct >= 50 ? 'moyen' : 'bas') + '"><span class="pct">' + pct + '<small> %</small></span><span class="sur">' + correct + ' sur ' + qs.length + '</span></div>' +
        '<div class="resultat-txt"><p class="msg">' + (classe.auto ? 'Le temps est écoulé : ton test est remis.' : 'Merci, ton test est remis.') + '</p><p class="conseil">' + t2(['Ton professeur te montrera la correction.', 'Je leerkracht toont je later de verbetering.']) + '</p></div></section>' +
        '<div class="actions">' + bouton('Retour au parcours', function () { vPresent(par.onglet); }, 'primaire') + '</div>', filPresent(par.titre));
      return;
    }
  } else {
    pr.test = { meilleur: Math.max(pr.test ? pr.test.meilleur : 0, pct), reussi: (pr.test && pr.test.reussi) || reussi, n: (pr.test ? pr.test.n : 0) + 1 };
    sauverProg();
    enregistrer({ module: par.titre, moduleId: pid, etape: 'Test final', type: 'test', tentative: pr.tentative }, res);
  }

  const li = function (q, i) {
    const s = norm(saisies[i]);
    const rep = justes[i] ? '<ins class="juste">' + esc(q.accept[0]) + '</ins>' : '<del>' + (s ? esc(s) : '(vide)') + '</del> <ins>' + esc(q.accept[0]) + '</ins>';
    return '<li class="' + (justes[i] ? 'juste' : 'faux') + '"><span class="num">' + (i + 1) + '</span><span class="marque" aria-hidden="true">' + (justes[i] ? '✓' : '✗') + '</span><div class="q-ligne">' + q.avant + (q.colle ? '' : ' ') + rep + ' ' + q.apres + '</div></li>';
  };
  const cles = Object.keys(faibles).sort(function (a, b) { return faibles[b] - faibles[a]; });
  let h = '<p class="sur-titre">' + nb(par.titre) + '</p><h1>Résultat du test</h1>' +
    '<section class="resultat"><div class="score-grand ' + (reussi ? 'ok' : 'bas') + '"><span class="pct">' + pct + '<small> %</small></span><span class="sur">' + correct + ' sur ' + qs.length + '</span></div>' +
    '<div class="resultat-txt"><p class="msg">' + (classe ? (classe.auto ? 'Le temps est écoulé : ton test est remis.' : 'Merci, ton test est remis.') : reussi ? 'Bravo, tu as réussi le parcours !' : 'Pas encore réussi : il faut ' + CONFIG.SEUIL + ' %.') + '</p>' +
    (cles.length ? '<p class="conseil">À revoir : ' + cles.map(function (k) { return NOM_LISTE[k] + ' (' + faibles[k] + ' erreur' + (faibles[k] > 1 ? 's' : '') + ')'; }).join(', ') + '.</p>' : '<p class="conseil">Aucune erreur. Félicitations !</p>') +
    (sorties ? '<p class="conseil sorties-note">Tu as quitté la page du test ' + sorties + ' fois. Ton professeur le voit dans ses résultats.</p>' : '') + '</div></section>' +
    '<section class="bloc"><div class="corr-tete"><h2>Correction</h2>' + (correct < qs.length && correct > 0 ? '<label class="bascule"><input type="checkbox" id="seul-err"> Voir seulement mes erreurs</label>' : '') + '</div>' +
    '<p class="legende"><del>ta réponse</del> <ins>bonne réponse</ins></p>' +
    '<ol class="test-liste corrige" id="corr">' + qs.map(li).join('') + '</ol></section>' +
    '<div class="actions">' + (classe ? bouton('Retour au parcours', function () { vPresent(par.onglet); }, 'primaire') : reussi ? bouton('Retour au parcours', function () { vPresent(par.onglet); }, 'primaire') + bouton('Refaire un test', function () { demarrerTest(pid); })
      : bouton('Revoir les étapes', function () { vPresent(par.onglet); }, 'primaire') + bouton('Refaire un test', function () { demarrerTest(pid); })) + '</div>';
  affiche(h, filPresent(par.titre));
  const cb = $('#seul-err'); if (cb) cb.addEventListener('change', function () { $('#corr').classList.toggle('seul-err', cb.checked); });
}

/* conjugaison complète en six cases ; la terminaison des verbes réguliers est mise en évidence */
function conjCases(v) {
  return '<span class="flash-conj">' + [0, 1, 2, 3, 4, 5].map(function (p) {
    const s = sujetPour(v, p, ['je', 'tu', 'il', 'nous', 'vous', 'ils'][p]);
    const c = conj(v, p);
    let f = v.t === 'irr' ? c.main : c.stem + '<b>' + c.end + '</b>';
    if (v.pron) { const r = REFL[p]; f = (VOYELLE.test(c.main) && r.length === 2 ? r[0] + "'" : r + ' ') + f; }
    return '<span><i>' + s + '</i>' + (s === "j'" ? '' : ' ') + f + '</span>';
  }).join('') + '</span>';
}
function formesTexte(v) { return [0, 1, 2, 3, 4, 5].map(function (p) { return conj(v, p).main; }).join(', '); }
